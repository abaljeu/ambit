<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Ambit</title>
    <script>if (location.hostname === "localhost" || location.hostname === "127.0.0.1") 
        document.title = "Local Ambit";</script>
    <link rel="stylesheet" href="/ambit/style.css">
    <link id="user-css" rel="stylesheet" href="/ambit/user.css">
</head>
<body>
    <!-- command-dock-sprite -->
    <div id="app">
        <div id="amb-sticky-header" class="amb-sticky-header">
            <div class="amb-header-row2">
                <span id="sync-status" class="amb-sync-status"></span>
                <span id="db-status" class="amb-db-status"></span>
                <span id="key-last-key" class="amb-last-result"></span>
                <!-- <span id="server-build-stamp" class="amb-last-result" title="Deployment time (server + client assets)"></span> -->
            </div>
        </div>
        <main id="amb-document" class="amb-document">
            Loading...
            <input id="hidden-input" class="amb-hidden-input" inputmode="none" autocomplete="off" tabindex="-1">
        </main>
        <div id="command-palette" class="amb-dialog">
            <div class="amb-dialog-context amb-dock-base">Command palette</div>
            <input id="command-palette-input" class="amb-dialog-input" type="text" placeholder="Search commands..." autocomplete="off">
            <ul id="command-palette-results" class="amb-dialog-results"></ul>
        </div>
        <div id="search-dialog" class="amb-dialog">
            <div id="search-dialog-context" class="amb-dialog-context" aria-live="polite"></div>
            <input id="search-dialog-input" class="amb-dialog-input" type="text" placeholder="Search nodes (use $name)..." autocomplete="off">
            <ul id="search-dialog-results" class="amb-dialog-results"></ul>
        </div>
        <div id="file-search-dialog" class="amb-dialog">
            <div id="file-search-dialog-context" class="amb-dialog-context" aria-live="polite"></div>
            <input id="file-search-dialog-input" class="amb-dialog-input" type="text"
                placeholder="Search existing files..." autocomplete="off">
            <ul id="file-search-dialog-results" class="amb-dialog-results"></ul>
            <button id="file-search-dialog-new-workspace" class="amb-dialog-new" type="button">New Workspace</button>
            <button id="file-search-dialog-new-file" class="amb-dialog-new" type="button">New File</button>
            <button id="file-search-dialog-new-folder" class="amb-dialog-new" type="button">New Folder</button>
        </div>
        <div id="rename-prompt" class="amb-dialog">
            <div class="amb-dialog-context amb-dock-base">Rename</div>
            <input id="rename-prompt-input" class="amb-dialog-input" type="text" placeholder="New name" autocomplete="off">
        </div>
        <div id="css-class-prompt" class="amb-dialog">
            <div class="amb-dialog-context amb-dock-base">Edit classes</div>
            <input id="css-class-prompt-input" class="amb-dialog-input" type="text" placeholder="Classes (space-separated)" autocomplete="off">
        </div>
        <div id="blocking-alert" class="amb-blocking-alert" aria-modal="true" role="alertdialog" aria-labelledby="blocking-alert-title" aria-describedby="blocking-alert-message">
            <div class="amb-blocking-alert-panel">
                <h2 id="blocking-alert-title" class="amb-blocking-alert-title"></h2>
                <p id="blocking-alert-message" class="amb-blocking-alert-message"></p>
                <button type="button" id="blocking-alert-ok" class="amb-blocking-alert-ok">OK</button>
            </div>
        </div>
        <div id="amb-sticky-footer" class="amb-sticky-footer">
            <div class="amb-command-buttons"></div>
        </div>
    </div>
    <script type="module" src="/ambit/Program.js"></script>
</body>
</html>
