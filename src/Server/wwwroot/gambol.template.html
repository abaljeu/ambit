<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambit</title>
    <script>if (location.hostname === "localhost" || location.hostname === "127.0.0.1") 
        document.title = "Local Ambit";</script>
    <link rel="stylesheet" href="/ambit/style.css">
    <link id="user-css" rel="stylesheet" href="/ambit/user.css">
</head>
<body>
    <div id="app">
        Loading...
        <input id="hidden-input" class="amb-hidden-input" autocomplete="off" tabindex="-1">
        <div id="amb-sticky-header" class="amb-sticky-header">
            <div class="amb-command-buttons"></div>
            <div class="amb-header-row2">
                <span id="sync-status" class="amb-sync-status"></span>
                <span id="db-status" class="amb-db-status"></span>
                <span id="key-last-key" class="amb-last-key"></span>
                <!-- <span id="server-build-stamp" class="amb-last-key" title="Deployment time (server + client assets)"></span> -->
            </div>
        </div>
        <div id="command-palette" class="amb-palette">
            <input id="command-palette-input" class="amb-palette-input" type="text" placeholder="Search commands..." autocomplete="off">
            <ul id="command-palette-results" class="amb-palette-results"></ul>
        </div>
        <div id="search-dialog" class="amb-palette">
            <input id="search-dialog-input" class="amb-palette-input" type="text" placeholder="Search nodes (use $name)..." autocomplete="off">
            <ul id="search-dialog-results" class="amb-palette-results"></ul>
        </div>
        <div id="css-class-prompt" class="amb-palette">
            <input id="css-class-prompt-input" class="amb-palette-input" type="text" placeholder="Classes (space-separated)" autocomplete="off">
        </div>
        <div id="blocking-alert" class="amb-blocking-alert" aria-modal="true" role="alertdialog" aria-labelledby="blocking-alert-title" aria-describedby="blocking-alert-message">
            <div class="amb-blocking-alert-panel">
                <h2 id="blocking-alert-title" class="amb-blocking-alert-title"></h2>
                <p id="blocking-alert-message" class="amb-blocking-alert-message"></p>
                <button type="button" id="blocking-alert-ok" class="amb-blocking-alert-ok">OK</button>
            </div>
        </div>
    </div>
    <script type="module" src="/ambit/Program.js"></script>
</body>
</html>
