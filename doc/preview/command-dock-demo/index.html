<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command dock demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Inline sprite (copy of src/Server/wwwroot/command-dock.svg) for file:// -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
      <symbol id="amb-icon-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 14 4 9l5-5" />
          <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" />
      </symbol>
      <symbol id="amb-icon-redo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 14 5-5-5-5" />
          <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13" />
      </symbol>
      <symbol id="amb-icon-zoom-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" x2="16.65" y1="21" y2="16.65" />
          <line x1="8" x2="14" y1="11" y2="11" />
      </symbol>
      <symbol id="amb-icon-zoom-in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" x2="16.65" y1="21" y2="16.65" />
          <line x1="11" x2="11" y1="8" y2="14" />
          <line x1="8" x2="14" y1="11" y2="11" />
      </symbol>
      <symbol id="amb-icon-move-tools" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="7" y="8" width="10" height="8" rx="1"  fill="solid"/>
        <path d="m9 4  3 -3 3 3" />
        <path d="m9 20 3  3 3 -3" />
        <path d="m20 9  3 3 -3 3" />
        <path d="m4  9 -3 3 3 3" />
    </symbol>
      <symbol id="amb-icon-select-tools" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="7" y="8" width="10" height="8" rx="1" />
          <path d="m9 4  3 -3 3 3" />
          <path d="m9 20 3  3 3 -3" />
          <path d="m20 9  3 3 -3 3" />
          <path d="m4  9 -3 3 3 3" />
      </symbol>
      <symbol id="amb-icon-find" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21 21-4.34-4.34" />
          <circle cx="11" cy="11" r="8" />
      </symbol>
      <symbol id="amb-icon-jump" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h6v6" />
          <path d="M10 14 21 3" />
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
      </symbol>
      <symbol id="amb-icon-more" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="1" />
          <circle cx="19" cy="12" r="1" />
          <circle cx="5" cy="12" r="1" />
      </symbol>
      <!-- Select: hollow rect + double chevrons in direction -->
      <symbol id="amb-icon-sel-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m8 10 4-3 4 3" />
          <path d="m8 6 4-3 4 3" />
          <rect x="5.75" y="13" width="12.5" height="8" rx="1" />
      </symbol>
      <symbol id="amb-icon-sel-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5.75" y="3" width="12.5" height="8" rx="1" />
          <path d="m8 14 4 3 4-3" />
          <path d="m8 18 4 3 4-3" />
      </symbol>
      <symbol id="amb-icon-sel-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m4 17-3-5 3-5" />
          <path d="m8 17 -3-5 3-5" />
          <rect x="12" y="8" width="11" height="8" rx="1" />
      </symbol>
      <symbol id="amb-icon-sel-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="8" width="11" height="8" rx="1" />
          <path d="m20 17 3-5 -3-5" />
          <path d="m15 17 3-5 -3-5" />
      </symbol>
      <!-- Move: solid rect + double chevrons in direction -->
      <symbol id="amb-icon-move-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m8 10 4-3 4 3" />
          <path d="m8 6 4-3 4 3" />
          <rect x="5.75" y="13" width="12.5" height="8" rx="1" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="amb-icon-move-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5.75" y="3" width="12.5" height="8" rx="1" fill="currentColor" stroke="none" />
          <path d="m8 14 4 3 4-3" />
          <path d="m8 18 4 3 4-3" />
      </symbol>
      <symbol id="amb-icon-move-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m4 17-3-5 3-5" />
          <path d="m9 17 -3-5 3-5" />
          <rect x="12" y="8" width="11" height="8" rx="1" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="amb-icon-move-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="8" width="11" height="8" rx="1" fill="currentColor" stroke="none" />
          <path d="m20 17 3-5 -3-5" />
          <path d="m15 17 3-5 -3-5" />
      </symbol>
      <symbol id="amb-icon-indent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 5H11" />
          <path d="M21 12H11" />
          <path d="M21 19H11" />
          <path d="m3 8 4 4-4 4" />
      </symbol>
      <symbol id="amb-icon-outdent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 5H11" />
          <path d="M21 12H11" />
          <path d="M21 19H11" />
          <path d="m7 8-4 4 4 4" />
      </symbol>
      <symbol id="amb-icon-sel-to-start" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m8 10 4-3 4 3" />
          <path d="m8 6 4-3 4 3" />
          <path d="m7 1 10 0" />
          <rect x="5.75" y="13" width="12.5" height="8" rx="1" />
      </symbol>
      <symbol id="amb-icon-sel-to-end" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5.75" y="3" width="12.5" height="8" rx="1" />
          <path d="m8 14 4 3 4-3" />
          <path d="m8 18 4 3 4-3" />
          <path d="m7 23 10 0" />
      </symbol>
      <symbol id="amb-icon-move-to-start" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m8 10 4-3 4 3" />
          <path d="m8 6 4-3 4 3" />
          <path d="m7 1 10 0" />
          <rect x="5.75" y="13" width="12.5" height="8" rx="1" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="amb-icon-move-to-end" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5.75" y="3" width="12.5" height="8" rx="1" fill="currentColor" stroke="none" />
          <path d="m8 14 4 3 4-3" />
          <path d="m8 18 4 3 4-3" />
          <path d="m7 23 10 0" />
      </symbol>
      <symbol id="amb-icon-palette" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3" />
      </symbol>
      <symbol id="amb-icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
          <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
      </symbol>
      <symbol id="amb-icon-duplicate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="15" x2="15" y1="12" y2="18" />
          <line x1="12" x2="18" y1="15" y2="15" />
          <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
          <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
      </symbol>
      <symbol id="amb-icon-edit-classes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13.172 2a2 2 0 0 1 1.414.586l6.71 6.71a2.4 2.4 0 0 1 0 3.408l-4.592 4.592a2.4 2.4 0 0 1-3.408 0l-6.71-6.71A2 2 0 0 1 6 9.172V3a1 1 0 0 1 1-1z" />
          <path d="M2 7v6.172a2 2 0 0 0 .586 1.414l6.71 6.71a2.4 2.4 0 0 0 3.191.193" />
          <circle cx="10.5" cy="6.5" r=".5" fill="currentColor" />
      </symbol>
      <symbol id="amb-icon-move-selected" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20" />
          <path d="m15 19-3 3-3-3" />
          <path d="m19 9 3 3-3 3" />
          <path d="M2 12h20" />
          <path d="m5 9-3 3 3 3" />
          <path d="m9 5 3-3 3 3" />
      </symbol>
    </svg>
    <section class="icon-prototype" aria-label="Icon prototype comparison">
        <p class="icon-prototype-title">Direction prototypes — hollow rect (select) vs solid rect (move)</p>
        <div class="icon-prototype-grid">
            <figure>
                <svg class="icon-prototype-glyph" aria-hidden="true"><use href="#amb-icon-sel-up"></use></svg>
                <figcaption>Selection up</figcaption>
            </figure>
            <figure>
                <svg class="icon-prototype-glyph" aria-hidden="true"><use href="#amb-icon-sel-down"></use></svg>
                <figcaption>Selection down</figcaption>
            </figure>
            <figure>
                <svg class="icon-prototype-glyph" aria-hidden="true"><use href="#amb-icon-sel-left"></use></svg>
                <figcaption>Selection left</figcaption>
            </figure>
            <figure>
                <svg class="icon-prototype-glyph" aria-hidden="true"><use href="#amb-icon-sel-right"></use></svg>
                <figcaption>Selection right</figcaption>
            </figure>
            <figure>
                <svg class="icon-prototype-glyph amb-prototype-move" aria-hidden="true"><use href="#amb-icon-move-up"></use></svg>
                <figcaption>Move Up</figcaption>
            </figure>
            <figure>
                <svg class="icon-prototype-glyph amb-prototype-move" aria-hidden="true"><use href="#amb-icon-move-down"></use></svg>
                <figcaption>Move Down</figcaption>
            </figure>
            <figure>
                <svg class="icon-prototype-glyph amb-prototype-move" aria-hidden="true"><use href="#amb-icon-move-left"></use></svg>
                <figcaption>Move left</figcaption>
            </figure>
            <figure>
                <svg class="icon-prototype-glyph amb-prototype-move" aria-hidden="true"><use href="#amb-icon-move-right"></use></svg>
                <figcaption>Move right</figcaption>
            </figure>
        </div>
    </section>
    <div id="app">
        <div id="amb-sticky-header" class="amb-sticky-header">
            <div class="amb-command-buttons"></div>
        </div>
        <p class="demo-note">Static preview of the Ambit command dock. Panel toggles work; command buttons are no-ops. Open <code>index.html</code> directly in a browser.</p>
        <div class="amb-view-root">Sample outline</div>
        <div class="amb-row amb-row-owned">
            <span class="amb-fold-toggle">−</span>
            <span class="amb-text">First node (select me in the real app)</span>
        </div>
        <div class="amb-row amb-row-owned">
            <span class="amb-indent"></span>
            <span class="amb-fold-toggle"> </span>
            <span class="amb-text">Indented child</span>
        </div>
        <div class="amb-row amb-row-owned">
            <span class="amb-fold-toggle">−</span>
            <span class="amb-text">Another top-level row</span>
        </div>
    </div>
    <script src="dock.js"></script>
</body>
</html>
